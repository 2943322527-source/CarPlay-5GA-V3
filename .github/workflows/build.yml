name: Build CarPlay 5GA WidthFix RootHide DEB - Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK on Linux
        uses: iossxx/theos-action@v1
        with:
          theos-src: https://github.com/roothide/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
          orion: 'false'

      - name: Compile and package for RootHide
        run: |
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay5GA-WidthFix-V3-RootHide-Linux-DEB
          path: packages/*.deb
          if-no-files-found: error
